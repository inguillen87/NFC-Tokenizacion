name: Prepare isolated SUN critical path
on:
  push:
    branches: [codex/nexid-sun-critical-path-20260930]
    paths: [scripts/qa/prepare-sun-performance.py, .github/workflows/prepare-sun-performance.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'inguillen87/NFC-Tokenizacion' && github.ref == 'refs/heads/codex/nexid-sun-critical-path-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NODE_ENV: test
      VERCEL_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Apply only exact base-bound replacements
        run: python3 scripts/qa/prepare-sun-performance.py
      - name: Install and run SUN regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:sun --workspace api
          npm run check:secrets
      - name: Commit verified files only to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/nexid-sun-critical-path-20260930 | cut -f1)" = "$GITHUB_SHA"
          while IFS= read -r path; do git add -- "$path"; done < sun-prepared-paths.txt
          rm sun-prepared-paths.txt
          git rm scripts/qa/prepare-sun-performance.py .github/workflows/prepare-sun-performance.yml
          git diff --cached --check
          git config user.name 'NexID implementation'
          git config user.email 'inguillen87@users.noreply.github.com'
          git commit -m 'perf(api): shorten SUN response path without deferring canonical validation'
          git push origin HEAD:refs/heads/codex/nexid-sun-critical-path-20260930
          git show --stat --oneline HEAD
