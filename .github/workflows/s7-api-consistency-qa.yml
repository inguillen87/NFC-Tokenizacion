name: S7 API provenance and consented location
on:
  push:
    branches: [codex/nexid-s7-api-consistency-20260921]
    paths:
      - apps/api/**
      - packages/core/**
      - scripts/qa/*s7*
      - .github/workflows/s7-api-consistency-qa.yml
permissions:
  contents: read
concurrency:
  group: nexid-s7-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: nexid_e2e
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: nexid_e2e_s7
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexid_e2e -d nexid_e2e_s7"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focal API regressions without production credentials or network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexid-s7-evidence"
          node scripts/qa/run-s7-api-unit.mjs 2>&1 | tee "$RUNNER_TEMP/nexid-s7-evidence/focal-tests.log"
      - name: Actual SQL against disposable PostgreSQL
        shell: bash
        env:
          NODE_ENV: test
          VERCEL_ENV: test
          NEXID_S7_QA_DATABASE_URL: postgresql://nexid_e2e:ephemeral-ci-password@127.0.0.1:5432/nexid_e2e_s7
        run: |
          set -euo pipefail
          node --require ./scripts/qa/s7-loopback-only.cjs --import tsx --test --test-concurrency=1 apps/api/tests/admin-physical-taps-postgres.test.mjs apps/api/tests/analytics-location-postgres.test.mjs apps/api/tests/realtime-operational-provenance-postgres.test.mjs 2>&1 | tee "$RUNNER_TEMP/nexid-s7-evidence/postgres-tests.log"
      - name: API production build and full build regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm run build:api 2>&1 | tee "$RUNNER_TEMP/nexid-s7-evidence/api-build.log"
          npm run check:secrets 2>&1 | tee "$RUNNER_TEMP/nexid-s7-evidence/secrets.log"
          git diff --exit-code -- apps packages package.json package-lock.json
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/nexid-s7-evidence/candidate-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexid-s7-api-evidence
          path: ${{ runner.temp }}/nexid-s7-evidence/
          if-no-files-found: error
          retention-days: 3
