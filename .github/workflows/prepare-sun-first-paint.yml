name: Prepare isolated SUN first paint
on:
  push:
    branches: [codex/nexid-sun-first-paint-20260930]
    paths: [scripts/qa/prepare-sun-first-paint.py, .github/workflows/prepare-sun-first-paint.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'inguillen87/NFC-Tokenizacion' && github.ref == 'refs/heads/codex/nexid-sun-first-paint-20260930'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NODE_ENV: test
      VERCEL_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 85223567b33ee675d9aa64bb43f325f71af996d3
          path: .paired-runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Apply exact web patch and approved dependency set
        run: |
          python3 scripts/qa/prepare-sun-first-paint.py
          rm -rf .paired-runtime
      - name: Install and run web regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --workspace web
          npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
          npm run check:secrets
      - name: Commit verified files only to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/codex/nexid-sun-first-paint-20260930 | cut -f1)" = "$GITHUB_SHA"
          while IFS= read -r path; do git add -- "$path"; done < sun-prepared-paths.txt
          rm sun-prepared-paths.txt
          git rm scripts/qa/prepare-sun-first-paint.py .github/workflows/prepare-sun-first-paint.yml
          git diff --cached --check
          git config user.name 'NexID implementation'
          git config user.email 'inguillen87@users.noreply.github.com'
          git commit -m 'perf(web): show SUN content earlier and isolate optional location work'
          git push origin HEAD:refs/heads/codex/nexid-sun-first-paint-20260930
          git show --stat --oneline HEAD
