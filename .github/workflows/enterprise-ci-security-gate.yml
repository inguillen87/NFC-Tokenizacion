name: Enterprise CI security gate

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  policy-and-supply-chain:
    name: Policy, secrets, dependencies and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.1"
          cache: npm

      - name: Verify this mandatory workflow contract
        run: node --test scripts/tests/enterprise-ci-security-workflow.test.mjs scripts/tests/enterprise-ci-dependency-bootstrap.test.mjs

      - name: Scan tracked and untracked repository files for secrets
        run: |
          npm run check:secrets
          npm run test:security-gates

      - name: Fail on unapproved high or critical dependencies
        run: node scripts/enterprise-dependency-audit.mjs

      - name: Install audited lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate migration safety and gate contracts
        run: |
          npm run check:migrations:safety
          npm run test:migration-gates

  api-and-sdk:
    name: API and SDK security contracts
    needs: policy-and-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.1"
          cache: npm

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build API and run its security contract suites
        run: npm run build:api

      - name: Typecheck, test, build and package-smoke the SDK
        run: npm run check --workspace=@product/nexid-server-sdk

  product-surfaces-and-executor:
    name: Product surfaces and executor regression
    needs: policy-and-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.1"
          cache: npm

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck and test dashboard
        run: |
          npm run typecheck:dashboard
          npm test --workspace=dashboard

      - name: Build dashboard
        run: npm run build:dashboard

      - name: Test and build public web
        run: |
          npm test --workspace=web
          npm run build:web

      - name: Check and test executor
        run: npm run build --workspace=executor

  enterprise-security-gate:
    name: Enterprise security gate
    if: ${{ always() }}
    needs:
      - policy-and-supply-chain
      - api-and-sdk
      - product-surfaces-and-executor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless every required job passed
        env:
          POLICY_RESULT: ${{ needs['policy-and-supply-chain'].result }}
          API_SDK_RESULT: ${{ needs['api-and-sdk'].result }}
          SURFACES_EXECUTOR_RESULT: ${{ needs['product-surfaces-and-executor'].result }}
        run: |
          node -e "const results=[process.env.POLICY_RESULT,process.env.API_SDK_RESULT,process.env.SURFACES_EXECUTOR_RESULT]; if(results.some((result)=>result!=='success')){console.error('Required enterprise security jobs did not all succeed:', results.join(', '));process.exit(1)}"

      - name: Checkout evidence writer without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Node runtime for evidence writer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.1"

      - name: Write commit-bound gate manifest
        run: node scripts/write-enterprise-ci-security-manifest.mjs artifacts/enterprise-ci-security/manifest.json

      - name: Upload commit-bound gate manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-security-${{ github.sha }}
          path: artifacts/enterprise-ci-security/manifest.json
          if-no-files-found: error
          retention-days: 30
