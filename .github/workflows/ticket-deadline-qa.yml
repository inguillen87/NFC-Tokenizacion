name: Dashboard ticket and CRM acceptance
on:
  push:
    branches: [codex/nexid-s9-ticket-deadline-20260922]
    paths:
      - apps/dashboard/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/ticket-deadline-qa.yml
permissions:
  contents: read
concurrency:
  group: nexid-ticket-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete dashboard checks on this exact commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/enterprise-dependency-audit.mjs
          npm run typecheck --workspace dashboard
          npm test --workspace dashboard
          npm run build:dashboard
          npm run check:secrets
          git diff --exit-code -- apps packages package.json package-lock.json
      - name: Install isolated browser tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nexid-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright-core@1.55.1 axe-core@4.10.3
          node "$RUNNER_TEMP/nexid-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Actual support and CRM components with synthetic transport
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexid-browser/node_modules/playwright-core/index.mjs
          AXE_MODULE_PATH: ${{ runner.temp }}/nexid-browser/node_modules/axe-core/axe.min.js
          QA_OUTPUT: ${{ runner.temp }}/nexid-ticket-deadline/browser
        run: |
          node apps/dashboard/tests/support-tickets.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-customer-activity/browser" node apps/dashboard/tests/customer-activity-summary.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-dependency-map/browser" node apps/dashboard/tests/dependency-map.browser.mjs
          node node_modules/next/dist/bin/next start apps/dashboard --hostname 127.0.0.1 --port 33982 > "$RUNNER_TEMP/nexid-map-next.log" 2>&1 &
          map_server=$!
          trap 'kill "$map_server" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ready=false; for(let i=0;i<30;i++){try{const r=await fetch("http://127.0.0.1:33982/vendor/maplibre-gl/6.4.1/maplibre-gl-worker.mjs");if(r.ok){ready=true;break}}catch{} await new Promise(r=>setTimeout(r,500))} if(!ready)process.exit(1)'
          NEXT_QA_ORIGIN=http://127.0.0.1:33982 QA_OUTPUT="$RUNNER_TEMP/nexid-next-map/browser" node apps/dashboard/tests/dependency-map.browser.mjs
      - name: Record verification identity
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          printf 'Candidate: `%s`\n\nJob status: %s\n' "$GITHUB_SHA" "$VALIDATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '\nNo deployment, migrations, artifact upload or persistent cache.\n' >> "$GITHUB_STEP_SUMMARY"
