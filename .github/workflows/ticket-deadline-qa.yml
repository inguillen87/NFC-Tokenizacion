name: Dashboard ticket and CRM acceptance
on:
  pull_request:
    paths: ['apps/dashboard/**', 'packages/**', 'package.json', 'package-lock.json', '.github/workflows/ticket-deadline-qa.yml']
  push:
    branches: [codex/nexid-s9-ticket-deadline-20260922, codex/nexid-operator-workbench-20260923, codex/nexid-roll-intake-20260923, codex/nexid-request-cancellation-ui-20260924, codex/nexid-request-quotes-ui-20260924, codex/nexid-supplier-binding-ui-20260924, codex/nexid-delivery-ack-ui-20260924, codex/nexid-runtime-console-ui-20260924, codex/nexid-integrated-services-ui-20260924, codex/nexid-request-read-safety-20260924, codex/nexid-runtime-access-fix-20260924, codex/nexid-release-convergence-20260925, codex/nexid-request-form-ux-20260925, codex/nexid-request-form-integrated-20260925, codex/nexid-request-inbox-ux-20260925, codex/nexid-inbox-integrated-20260925, codex/nexid-draft-reconcile-20260925, codex/nexid-reconcile-integrated-20260925, codex/nexid-request-case-summary-20260925, codex/nexid-case-summary-integrated-20260925, codex/nexid-request-continuity-20260928, codex/nexid-advanced-continuity-20260928, codex/nexid-dpp-launchpad-20260928, codex/nexid-passport-enrollment-20260928, codex/nexid-editorial-queue-20260929, codex/nexid-studio-editing-20260929]
    paths:
      - apps/dashboard/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/ticket-deadline-qa.yml
permissions:
  contents: read
concurrency:
  group: nexid-ticket-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete dashboard checks on this exact commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/enterprise-dependency-audit.mjs
          npm run typecheck --workspace dashboard
          npm test --workspace dashboard
          npm run build:dashboard
          npm run check:secrets
          git diff --exit-code -- apps packages package.json package-lock.json
      - name: Install isolated browser tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nexid-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright-core@1.55.1 axe-core@4.10.3
          node "$RUNNER_TEMP/nexid-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Actual support and CRM components with synthetic transport
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexid-browser/node_modules/playwright-core/index.mjs
          AXE_MODULE_PATH: ${{ runner.temp }}/nexid-browser/node_modules/axe-core/axe.min.js
          QA_OUTPUT: ${{ runner.temp }}/nexid-ticket-deadline/browser
        run: |
          node apps/dashboard/tests/support-tickets.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-passport-enrollment/browser" node apps/dashboard/tests/passport-enrollment.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-editorial-queue/browser" node apps/dashboard/tests/editorial-queue-continuity.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-passport-editing/browser" node apps/dashboard/tests/passport-editing.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-passport-studio/browser" node apps/dashboard/tests/passport-studio.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-customer-activity/browser" node apps/dashboard/tests/customer-activity-summary.browser.mjs
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' | head -n 1)" QA_OUTPUT="$RUNNER_TEMP/nexid-customer-general-filter/browser" node apps/dashboard/tests/customer-general-filter-recovery.browser.mjs
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' | head -n 1)" QA_OUTPUT="$RUNNER_TEMP/nexid-table-catalog-recovery/browser" node apps/dashboard/tests/table-catalog-recovery.browser.mjs
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' | head -n 1)" QA_CATALOG_CONFIRMATION_MODE=guarded QA_SOURCE="$(git rev-parse HEAD)" QA_OUTPUT="$RUNNER_TEMP/nexid-catalog-confirmation/browser" node apps/dashboard/tests/catalog-confirmation-focus.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-member-history/browser" node apps/dashboard/tests/member-timeline-continuity.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-batch-navigation/browser" node apps/dashboard/tests/batch-workspace-navigation.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-dependency-map/browser" node apps/dashboard/tests/dependency-map.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-supplier-order-draft/browser" node apps/dashboard/tests/supplier-order-draft.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-supplier-requests/browser" node apps/dashboard/tests/supplier-requests.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-supplier-request-assignments/browser" node apps/dashboard/tests/supplier-request-assignments.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-roll-manifest/browser" node apps/dashboard/tests/roll-manifest-intake.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-request-cancellation/browser" node apps/dashboard/tests/supplier-request-cancellation.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-request-quotes/browser" node apps/dashboard/tests/supplier-request-quotes.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-supplier-binding/browser" node apps/dashboard/tests/supplier-request-binding.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-delivery-ack/browser" node apps/dashboard/tests/supplier-delivery-ack.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-runtime-console/browser" node apps/dashboard/tests/runtime-console.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-runtime-access/browser" node apps/dashboard/tests/runtime-access-hotfix.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-service-status/browser" node apps/dashboard/tests/supplier-service-status.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-request-read-safety/browser" node apps/dashboard/tests/supplier-request-read-safety.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-request-form/browser" node apps/dashboard/tests/supplier-request-draft-ux.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-case-summary/browser" node apps/dashboard/tests/supplier-request-case-summary.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-inbox/browser" node apps/dashboard/tests/supplier-request-inbox.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-review-continuity/browser" node apps/dashboard/tests/supplier-review-continuity.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-assignment-continuity/browser" node apps/dashboard/tests/supplier-assignment-continuity.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-pilot-launchpad/browser" node apps/dashboard/tests/pilot-launchpad.browser.mjs
          QA_OUTPUT="$RUNNER_TEMP/nexid-draft-reconcile/browser" node apps/dashboard/tests/supplier-draft-comparison.browser.mjs
          git --no-optional-locks ls-files --error-unmatch -- apps/dashboard/next-env.d.ts apps/dashboard/tsconfig.json >/dev/null
          if ! git --no-optional-locks diff --quiet HEAD --; then
            echo '::error::Loyalty browser QA requires a clean tracked checkout'
            exit 1
          fi
          loyalty_status=0
          QA_OUTPUT="$RUNNER_TEMP/nexid-loyalty-overview/browser" timeout --signal=TERM --kill-after=10s 210s node apps/dashboard/tests/loyalty-overview.browser.mjs || loyalty_status=$?
          if ! git --no-optional-locks diff --quiet HEAD --; then
            echo '::error::Loyalty browser QA left tracked checkout changes or could not verify cleanliness'
            exit 1
          fi
          if [ "$loyalty_status" -ne 0 ]; then
            printf '::error::Loyalty browser QA failed with exit code %s\n' "$loyalty_status"
            exit "$loyalty_status"
          fi
          echo 'Loyalty browser QA and tracked checkout verified'
          export NEXT_QA_ORIGIN=http://127.0.0.1:33982
          map_log="$RUNNER_TEMP/nexid-map-next.log"
          node node_modules/next/dist/bin/next start apps/dashboard --hostname 127.0.0.1 --port 33982 > "$map_log" 2>&1 &
          map_server=$!
          trap 'kill "$map_server" 2>/dev/null || true' EXIT
          if ! node apps/dashboard/tests/wait-for-next-map-worker.mjs; then
            if kill -0 "$map_server" 2>/dev/null; then
              echo "Next map server process is still running"
            else
              map_exit=0
              wait "$map_server" || map_exit=$?
              printf 'Next map server exited before readiness: %s\n' "$map_exit"
            fi
            if [[ ! -s "$map_log" ]]; then
              echo "Next map server emitted no startup output"
            elif grep -Fq 'EADDRINUSE' "$map_log"; then
              echo "Next map server reported a port conflict"
            elif grep -Fq 'Could not find a production build' "$map_log"; then
              echo "Next map server reported a missing production build"
            elif grep -Fq 'Ready in' "$map_log"; then
              echo "Next map server reported ready, but the worker request did not pass"
            else
              echo "Next map server startup output did not match a known readiness message"
            fi
            exit 1
          fi
          echo "Running browser checks with the Next-served map worker"
          QA_OUTPUT="$RUNNER_TEMP/nexid-next-map/browser" node apps/dashboard/tests/dependency-map.browser.mjs
      - name: Record verification identity
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          printf 'Candidate: `%s`\n\nJob status: %s\n' "$GITHUB_SHA" "$VALIDATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '\nNo deployment, migrations, artifact upload or persistent cache.\n' >> "$GITHUB_STEP_SUMMARY"
