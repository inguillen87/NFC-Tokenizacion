name: enterprise staging gates

run-name: enterprise staging gate / ${{ inputs.migration_phase }}

on:
  workflow_dispatch:
    inputs:
      migration_phase:
        description: "Current enterprise preflight or explicitly legacy 0050-0056 recovery gate; no option applies migrations"
        required: true
        default: current_0057_0096_preflight
        type: choice
        options:
          - current_0057_0096_preflight
          - legacy_0050_0056_preflight
          - legacy_0050_0056_after_0050_dry_run
          - legacy_0050_0056_postcheck

jobs:
  gates:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_DATABASE_ENDPOINT_ALLOWLIST: ${{ vars.STAGING_DATABASE_ENDPOINT_ALLOWLIST }}
      STAGING_MIGRATION_EXPECTED_BASELINE_LEDGER: ${{ vars.STAGING_MIGRATION_EXPECTED_BASELINE_LEDGER }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate WAF policy
        run: npm run check:waf:policy
      - name: Validate migration safety invariants
        run: npm run check:migrations:safety
      - name: Validate migration gate contracts
        run: npm run test:migration-gates

      # This is the authoritative current release gate. It is read-only at the
      # application level and fails closed when the real staging custody
      # keyring or any reviewed 0057-0096 schema capability is absent.
      - name: Current enterprise schema and custody preflight (0057-0096)
        if: inputs.migration_phase == 'current_0057_0096_preflight'
        env:
          DATABASE_URL: ${{ secrets.STAGING_RUNTIME_DATABASE_URL }}
          NEXID_RUNTIME_DB_ROLE: ${{ vars.STAGING_RUNTIME_DB_ROLE }}
          SDK_IDEMPOTENCY_MASTER_KEY_HEX: ${{ secrets.SDK_IDEMPOTENCY_MASTER_KEY_HEX }}
          SDK_IDEMPOTENCY_MASTER_KEY_ID: ${{ vars.SDK_IDEMPOTENCY_MASTER_KEY_ID }}
          SDK_IDEMPOTENCY_PREVIOUS_KEYS_JSON: ${{ secrets.SDK_IDEMPOTENCY_PREVIOUS_KEYS_JSON }}
        run: npm run db:enterprise-release:preflight --workspace=api

      # The following three options exist only for the historical 0050-0056
      # migration recovery runbook. They are not current enterprise release
      # authorization and cannot substitute for the 0057-0096 preflight above.
      - name: Legacy migration baseline preflight (before 0050-0056)
        if: inputs.migration_phase == 'legacy_0050_0056_preflight'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run gate:migrations:preflight
      - name: Legacy transactional dry-run (after committed 0050)
        if: inputs.migration_phase == 'legacy_0050_0056_after_0050_dry_run'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run gate:migrations:dry-run
      - name: Legacy PostgreSQL postcheck (0050-0056)
        if: inputs.migration_phase == 'legacy_0050_0056_postcheck'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run gate:migrations:postcheck
      - name: Legacy PostgreSQL and IOTA read-only gates (0050-0056)
        if: inputs.migration_phase == 'legacy_0050_0056_postcheck'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          IOTA_EVM_RPC_URL: ${{ secrets.STAGING_IOTA_EVM_RPC_URL }}
          IOTA_EVM_ANCHOR_CONTRACT_V2: ${{ secrets.STAGING_IOTA_EVM_ANCHOR_CONTRACT_V2 }}
          IOTA_KMS_PUBLISHER_ADDRESS: ${{ secrets.STAGING_IOTA_KMS_PUBLISHER_ADDRESS }}
          IOTA_EVM_EXPECTED_CHAIN_ID: "1076"
          IOTA_KMS_SIGNER_URL: ${{ secrets.STAGING_IOTA_KMS_SIGNER_URL }}
          IOTA_KMS_KEY_ID: ${{ secrets.STAGING_IOTA_KMS_KEY_ID }}
          IOTA_KMS_SIGNER_ALLOWED_HOSTS: ${{ secrets.STAGING_IOTA_KMS_SIGNER_ALLOWED_HOSTS }}
          IOTA_KMS_SIGNER_TOKEN: ${{ secrets.STAGING_IOTA_KMS_SIGNER_TOKEN }}
          POLYGON_KMS_SIGNER_URL: ${{ secrets.STAGING_POLYGON_KMS_SIGNER_URL }}
          POLYGON_KMS_KEY_ID: ${{ secrets.STAGING_POLYGON_KMS_KEY_ID }}
          POLYGON_KMS_SIGNER_ALLOWED_HOSTS: ${{ secrets.STAGING_POLYGON_KMS_SIGNER_ALLOWED_HOSTS }}
          POLYGON_KMS_PUBLISHER_ADDRESS: ${{ secrets.STAGING_POLYGON_KMS_PUBLISHER_ADDRESS }}
          POLYGON_KMS_SIGNER_TOKEN: ${{ secrets.STAGING_POLYGON_KMS_SIGNER_TOKEN }}
        run: npm run gate:enterprise
      - name: Core regression suites
        if: inputs.migration_phase == 'legacy_0050_0056_postcheck'
        run: |
          npm run test:proof --workspace=api
          npm test --workspace=executor
          node --test infra/cloudflare/webhook-recovery-worker/test/index.test.mjs
